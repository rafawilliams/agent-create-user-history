name: deploy

# Despliegue de u6-infrastructure (cicd-pipeline.md, NFR5.2, NFR5.7, NFR8.2). Solo corre en main.
# Un solo trabajo: plan sobre el commit fusionado, check_plan.py sobre ESE plan y apply de ESE
# mismo archivo; después compila y publica la pantalla, invalida /index.html y ejecuta la prueba de
# humo. Si la prueba falla, un segundo apply devuelve el alias `live` a la versión previa.
#
# Mientras no exista la variable AWS_APPLY_ROLE_ARN (antes del arranque manual) el flujo termina
# en verde con un aviso, para que un push a main no falle por falta de arranque.
#
# El plan nunca se sube como artefacto ni se imprime: solo un resumen de acciones por tipo. El
# archivo del plan y su JSON se borran de la máquina al terminar.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar (plan, comprobación, apply, pantalla y prueba de humo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
      STATE_BUCKET_NAME: ${{ vars.STATE_BUCKET_NAME }}
      FUNCTION_NAME: business-analyst-agent-story-service
    steps:
      - name: Guarda de arranque
        id: guard
        run: |
          if [ -z "$AWS_APPLY_ROLE_ARN" ]; then
            echo "::notice title=Despliegue omitido::Falta la variable AWS_APPLY_ROLE_ARN: el arranque manual (infra/bootstrap) todavia no se hizo. Ver infra/README.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$STATE_BUCKET_NAME" ]; then
            echo "::error title=Falta STATE_BUCKET_NAME::La variable STATE_BUCKET_NAME es obligatoria: sin deposito de estado no hay alternativa local."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.guard.outputs.enabled == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: '3.12'

      - name: Construir el paquete de la funcion (codigo y dependencias para Lambda)
        if: steps.guard.outputs.enabled == 'true'
        run: python infra/scripts/build_lambda_package.py

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: steps.guard.outputs.enabled == 'true'
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: steps.guard.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ env.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init (estado remoto; sin alternativa local)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: infra
        run: terraform init -input=false -backend-config="bucket=${STATE_BUCKET_NAME}"

      - name: Version actual del alias live (para el retroceso)
        id: previous
        if: steps.guard.outputs.enabled == 'true'
        run: |
          # Vacio en el primer despliegue: no hay version previa a la que volver.
          # Solo ResourceNotFoundException significa primer despliegue; cualquier otro error
          # (permisos, red) detiene el flujo para no perder la version a la que volver.
          if ! version="$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name live --query FunctionVersion --output text 2>"$RUNNER_TEMP/alias.err")"; then
            if grep -q 'ResourceNotFoundException' "$RUNNER_TEMP/alias.err"; then
              version=''
            else
              echo "::error title=No se pudo leer el alias live::$(head -c 300 "$RUNNER_TEMP/alias.err")"
              exit 1
            fi
          fi
          [ "$version" = "None" ] && version=''
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version previa del alias live: ${version:-ninguna (primer despliegue)}"

      - name: terraform plan -out (sobre el commit fusionado; sin imprimir el plan)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: infra
        env:
          # Vacio = la ultima version publicada. Tras un retroceso se fija a la version buena.
          TF_VAR_live_version: ${{ vars.LIVE_VERSION }}
          TF_VAR_allowed_emails: ${{ vars.TF_VAR_allowed_emails }}
          TF_VAR_google_client_id: ${{ secrets.TF_VAR_google_client_id }}
          TF_VAR_google_client_secret: ${{ secrets.TF_VAR_google_client_secret }}
          TF_VAR_microsoft_client_id: ${{ secrets.TF_VAR_microsoft_client_id }}
          TF_VAR_microsoft_client_secret: ${{ secrets.TF_VAR_microsoft_client_secret }}
        run: |
          terraform plan -input=false -no-color -out=tfplan > /dev/null
          terraform show -json tfplan > plan.json
          echo "Resumen del plan (acciones por cantidad; sin valores):"
          python3 -c "
          import collections, json
          plan = json.load(open('plan.json', encoding='utf-8'))
          counts = collections.Counter('+'.join(c['change']['actions']) for c in plan.get('resource_changes', []))
          [print(f'  {k}: {v}') for k, v in sorted(counts.items())]
          "

      - name: check_plan.py sobre ese mismo plan (tipos permitidos, eliminaciones, sensibilidad)
        if: steps.guard.outputs.enabled == 'true'
        run: python3 infra/scripts/check_plan.py infra/plan.json

      - name: terraform apply del mismo archivo de plan
        id: apply
        if: steps.guard.outputs.enabled == 'true'
        working-directory: infra
        run: terraform apply -input=false -no-color tfplan

      - name: Leer las salidas (identificadores publicos, sin secretos)
        id: outputs
        if: steps.guard.outputs.enabled == 'true'
        working-directory: infra
        run: |
          {
            echo "api_url=$(terraform output -raw api_url)"
            echo "web_url=$(terraform output -raw web_url)"
            echo "web_bucket=$(terraform output -raw web_bucket)"
            echo "web_distribution_id=$(terraform output -raw web_distribution_id)"
            echo "cognito_region=$(terraform output -raw cognito_region)"
            echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)"
            echo "cognito_domain=$(terraform output -raw cognito_domain)"
            echo "cognito_client_id=$(terraform output -raw cognito_client_id)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compilar la pantalla (variables VITE_ publicas desde las salidas)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: web
        env:
          VITE_API_URL: ${{ steps.outputs.outputs.api_url }}
          VITE_COGNITO_REGION: ${{ steps.outputs.outputs.cognito_region }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.outputs.outputs.cognito_user_pool_id }}
          VITE_COGNITO_DOMAIN: ${{ steps.outputs.outputs.cognito_domain }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.outputs.outputs.cognito_client_id }}
        run: |
          npm ci
          npm run build

      - name: Publicar la pantalla (sin --delete) e invalidar /index.html
        if: steps.guard.outputs.enabled == 'true'
        env:
          WEB_BUCKET: ${{ steps.outputs.outputs.web_bucket }}
          DISTRIBUTION_ID: ${{ steps.outputs.outputs.web_distribution_id }}
        run: |
          # Primero los archivos con hash (cache larga), luego el resto y por ultimo index.html con
          # no-cache. Sin --delete: la limpieza queda fuera del MVP y el deposito esta versionado.
          aws s3 sync web/dist/assets "s3://${WEB_BUCKET}/assets" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync web/dist "s3://${WEB_BUCKET}" --exclude "assets/*" --exclude "index.html" --cache-control "no-cache"
          aws s3 cp web/dist/index.html "s3://${WEB_BUCKET}/index.html" --cache-control "no-cache" --content-type "text/html"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html"

      - name: Prueba de humo
        id: smoke
        if: steps.guard.outputs.enabled == 'true'
        env:
          WEB_URL: ${{ steps.outputs.outputs.web_url }}
          API_URL: ${{ steps.outputs.outputs.api_url }}
          COGNITO_DOMAIN: ${{ steps.outputs.outputs.cognito_domain }}
        run: bash infra/scripts/smoke_test.sh "$WEB_URL" "$API_URL" "$COGNITO_DOMAIN"

      - name: Retroceso del alias live (segundo apply con live_version = version previa)
        if: ${{ failure() && steps.apply.outcome == 'success' }}
        working-directory: infra
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          # Vacio = la ultima version publicada. Tras un retroceso se fija a la version buena.
          TF_VAR_live_version: ${{ vars.LIVE_VERSION }}
          TF_VAR_allowed_emails: ${{ vars.TF_VAR_allowed_emails }}
          TF_VAR_google_client_id: ${{ secrets.TF_VAR_google_client_id }}
          TF_VAR_google_client_secret: ${{ secrets.TF_VAR_google_client_secret }}
          TF_VAR_microsoft_client_id: ${{ secrets.TF_VAR_microsoft_client_id }}
          TF_VAR_microsoft_client_secret: ${{ secrets.TF_VAR_microsoft_client_secret }}
        run: |
          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "::error title=Sin version previa::Es el primer despliegue: no hay version a la que volver. Corrige hacia adelante en una nueva solicitud."
            exit 0
          fi
          # El alias vuelve a la version previa SOLO con este apply. El siguiente despliegue vuelve a
          # leer la variable LIVE_VERSION: si sigue vacia, promovera de nuevo la ultima version
          # publicada. Por eso la persona debe fijar LIVE_VERSION a la version previa (se imprime
          # abajo) hasta que se publique la correccion, y vaciarla despues.
          terraform plan -input=false -no-color -out=rollback.tfplan -var "live_version=${PREVIOUS_VERSION}" > /dev/null
          terraform show -json rollback.tfplan > rollback.json
          python3 scripts/check_plan.py rollback.json
          terraform apply -input=false -no-color rollback.tfplan
          echo "::error title=Despliegue revertido::La prueba de humo fallo. El alias live volvio a la version ${PREVIOUS_VERSION}. ACCION: fija la variable de GitHub LIVE_VERSION=${PREVIOUS_VERSION} hasta liberar la correccion (despues vacia LIVE_VERSION); sin eso el proximo despliegue vuelve a promover la version mala. La pantalla debe volver a desplegarse a mano desde el commit anterior (el deposito esta versionado)."

      - name: Borrar el plan de la maquina
        if: ${{ always() }}
        run: rm -f infra/tfplan infra/plan.json infra/rollback.tfplan infra/rollback.json
